name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        with:
          managed: 'false'
          uv-version: '0.13.5'
      # Keep the original interpreter channel until its ordinary coherent proposal qualifies.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Preserve the actual tooling and application-requirement installation gates
        id: dependencies
        run: just setup
      - name: Check the unchanged processor source
        id: project
        run: just check-python
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
        if: always()
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.dependencies.outcome == 'failure' && 'failure' || steps.project.outcome }}
          task: source and installation qualification
          name: python

  semgrep:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    permissions:
      contents: read
    with:
      recipe: scan
      hosted-runner: ubuntu-24.04
      uv-version: '0.13.5'
      timeout-minutes: 15

  workflows:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    permissions:
      contents: read
    with:
      recipe: check-workflows
      fetch-depth: 0
      hosted-runner: ubuntu-24.04
      tools: zizmor@1.32.0,shellcheck@0.11.0
      tool-assets: .github/ci-tools.json
      timeout-minutes: 10

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@a12acfc75fd7daee2fac9a246ee60683fe18955b # v0.6.67
    permissions:
      contents: read

  gate:
    name: gate
    needs: [python, semgrep, workflows, merge-stops]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all actual source/install/security producers
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"python":"success","semgrep":"success","workflows":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
